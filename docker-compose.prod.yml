services:
  # ============================================================
  # NestJS API
  # ============================================================
  app:
    build:
      context: .
      target: production
    container_name: ypos-app
    restart: always

    ports:
      - '8000:8000'

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      PORT: 8000
      LOG_LEVEL: log
      LOKI_URL: http://loki:3100

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - backend

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: ypos-postgres
    restart: always

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ypos}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ypos}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ypos-redis
    restart: always

    command:
      - redis-server
      - --appendonly
      - 'yes'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  # ============================================================
  # Loki
  # ============================================================
  loki:
    image: grafana/loki:3.5.0
    container_name: ypos-loki
    restart: always

    command:
      - -config.file=/etc/loki/local-config.yaml

    ports:
      - '3100:3100'

    volumes:
      - loki_data:/loki

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:12.1.1
    container_name: ypos-grafana
    restart: always

    ports:
      - '3000:3000'

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP: 'false'

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      loki:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:

# ==============================================================
# Network
# ==============================================================
networks:
  backend:
    driver: bridge
